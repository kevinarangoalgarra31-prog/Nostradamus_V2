modeling:
  version: "3.0.0"
  decision_threshold: 0.50
  calibration_method: sigmoid
  inner_splits: 3

walk_forward:
  min_train_rows: 900
  calibration_rows: 180
  test_rows: 180
  step_rows: 180
  max_folds: 5

parameter_grid:
  n_estimators: [120]
  max_depth: [3, 5]
  learning_rate: [0.03, 0.07]
  subsample: [0.80]
  colsample_bytree: [0.80]
  min_child_weight: [1]
  reg_lambda: [1.0]
