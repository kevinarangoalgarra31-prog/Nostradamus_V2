experiment:
  name: nostradamus_v2_daily_direction
  version: "1.0"
  random_seed: 42

data:
  source: yfinance
  tickers:
    - BTC-USD
    - ETH-USD
  start_date: 2020-01-01
  # yfinance interpreta esta fecha como límite exclusivo: último dato esperado 2026-09-16.
  end_date: 2026-09-17
  interval: 1d
  auto_adjust: false

target:
  horizon_days: 1
  min_return: 0.0

features:
  sma_windows: [10, 20, 50]
  rsi_window: 14
  volatility_window: 20
  momentum_window: 10
  volume_window: 20
  ema_fast: 12
  ema_slow: 26
  ema_signal: 9

validation:
  min_rows: 252
  max_missing_ratio: 0.02

execution:
  commission_bps: 10
  slippage_bps: 5
